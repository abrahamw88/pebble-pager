<div style="padding: 10px 16px; border-radius: 999px; background: #E6E4DF; font-size: 15px; font-weight: 500">12-pixel light ring</div>
</div>
</div>
<div style="display: flex; gap: 24px; flex-wrap: wrap; align-items: center">

<script>
const palettes = {
  Lavender: { hi: '#EAE3F5', body: '#D5C9EB', shade: '#BBACD8', button: '#E1D7F2', deep: '#9A88BF', icon: '#8572AC' },
  Blush: { hi: '#F9E6EB', body: '#F1CFD9', shade: '#DFB2BF', button: '#F6DCE4', deep: '#C38C9B', icon: '#AF7787' },
  Mint: { hi: '#E5F1E4', body: '#CBE2CA', shade: '#ADCBAC', button: '#DAEAD9', deep: '#8BAC8A', icon: '#769775' },
  Sky: { hi: '#E3EDF8', body: '#C9DCF0', shade: '#A9C2DF', button: '#D7E5F4', deep: '#8BA4C7', icon: '#7590B5' }
};
// Every ring state from the build spec's behavior table.
// `lit` is how many of the 12 pixels are shown lit in the still render; `label` finishes "with the ring ...".
const ringStates = [
  { id: 'recording', name: 'Recording', color: '#F29BB5', lit: 7, desc: "The device's own color while button 1 is held", label: "filling in the device's own color while button 1 is held" },
  { id: 'playing', name: 'Message', color: '#7FB2F0', lit: 12, desc: "Pulses in the sender's color, with matching buzzes", label: "pulsing a message in the sender's color" },
  { id: 'waiting', name: 'Message waiting', color: '#7FB2F0', lit: 1, desc: "One pixel blinking slowly in the sender's color", label: "blinking one pixel in the sender's color" },
  { id: 'joining', name: 'Joining Wi-Fi', color: '#6FC6D6', lit: 4, desc: 'Cyan chase while joining Wi-Fi after switching on', label: 'chasing in cyan while it joins Wi-Fi' },
  { id: 'delivered', name: 'Received', color: '#6CC795', lit: 12, desc: 'One green sweep and a short buzz: the partner got the message', label: 'sweeping green with a short buzz' },
  { id: 'failed', name: 'Not received', color: '#E8736B', lit: 12, desc: 'Two red pulses and a short buzz; the message could not be sent or no receipt came', label: 'pulsing red twice' },
  { id: 'battery', name: 'Battery level', color: '#6CC795', lit: 9, desc: '1 to 12 pixels lit after a button 2 tap', label: 'showing the battery level' },
  { id: 'low', name: 'Low battery', color: '#EDAE55', lit: 12, desc: 'Amber blink every 60 s under 20%', label: 'blinking amber for low battery' },
  { id: 'setup', name: 'Wi-Fi setup', color: '#A98BE0', lit: 12, desc: 'Purple, filling then solid', label: 'purple for Wi-Fi setup' },
  { id: 'off', name: 'Turning off', color: '#E8736B', lit: 5, desc: 'Red, emptying, when button 2 is held to 10 s', label: 'emptying red as the device turns off' },
  { id: 'idle', name: 'Idle', color: '#000000', lit: 0, desc: 'Dark; the ring is powered off between animations', label: 'dark' }
];
const state = { colorway: 'Lavender', ring: 'recording' };
const tpl = document.getElementById('tpl').textContent;

function hex2rgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
function get(o, path) { return path.split('.').reduce((a, k) => (a == null ? a : a[k]), o); }

function build() {
  const c = palettes[state.colorway];
  const ring = ringStates.find(r => r.id === state.ring);
  const px = {};
  for (let i = 0; i < 12; i++) {
    const lit = i < ring.lit;
    px['p' + i] = { color: lit ? ring.color : c.shade, glow: lit ? 0.9 : 0, core: lit ? 1 : 0.7 };
  }
  const swatches = Object.keys(palettes).map(name => {
    const p = palettes[name];
    const sel = name === state.colorway ? '2px solid #1F2124' : '2px solid transparent';
    return `<div style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px; border-radius: 18px; border: ${sel}">
<svg width="84" height="133" viewBox="0 0 120 190" role="img" aria-label="${name} colorway swatch">
<path d="M53 18 C 50 -4, 70 -4, 67 18" fill="none" stroke="#C4A27F" style="stroke-width: 4; stroke-linecap: round"></path>
<path d="M120 0 C 186 0 240 44 240 110 L 240 317 C 240 357 207 390 167 390 L 73 390 C 33 390 0 357 0 317 L 0 110 C 0 44 54 0 120 0 Z" transform="translate(10,10) scale(0.4167,0.4231)" fill="${p.body}"></path>
<circle cx="60" cy="92" r="27" fill="${p.deep}" opacity="0.55"></circle>
<circle cx="60" cy="91" r="23" fill="${p.button}"></circle>
<circle cx="82" cy="144" r="9" fill="${p.deep}" opacity="0.7"></circle>
<circle cx="82" cy="144" r="6" fill="${p.button}"></circle>
</svg>
<div style="font-size: 14px; font-weight: 500">${name}</div>
</div>`;
  }).join('\n');
  const legend = `<div style="background: #FFFFFF; border-radius: 24px; padding: 24px 28px; display: flex; flex-direction: column; gap: 18px">
<div style="font-weight: 600; font-size: 17px">What the ring says</div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
${ringStates.map(r => { const [R, G, B] = hex2rgb(r.color === '#000000' ? '#9A9CA1' : r.color); return `<button class="state" data-ring="${r.id}" aria-pressed="${r.id === state.ring}" style="display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center">
<span style="width: 22px; height: 22px; border-radius: 999px; background: ${r.color === '#000000' ? '#2B2C2E' : r.color}; box-shadow: ${r.color === '#000000' ? 'none' : `0 0 18px 6px rgba(${R}, ${G}, ${B}, 0.5)`}; margin: 8px 0"></span>
<span style="font-size: 14px; font-weight: 600">${r.name}</span>
<span style="font-size: 13px; color: #5F6267">${r.desc}</span>
</button>`; }).join('\n')}
</div>
<div style="font-size: 14px; color: #4A4D52; line-height: 1.45">The ring powers off fully between animations to save battery. Each device has its own color, and messages play in the sender's color. Pink and blue here are example device colors.</div>
</div>`;
  return {
    c, px, swatches, legend,
    ringLabel: ring.label, colorwayName: state.colorway,
    colorwayOptions: Object.keys(palettes).map(n => `<option${n === state.colorway ? ' selected' : ''}>${n}</option>`).join(''),
    ringOptions: ringStates.map(r => `<option value="${r.id}"${r.id === state.ring ? ' selected' : ''}>${r.name}</option>`).join('')
  };
}

function render() {
  const vals = build();
  document.getElementById('app').innerHTML = tpl.replace(/\{\{\{?([\w.]+)\}?\}\}/g, (_, p) => get(vals, p));
  document.getElementById('colorway').onchange = e => { state.colorway = e.target.value; render(); document.getElementById('colorway').focus(); };
  document.getElementById('ring').onchange = e => { state.ring = e.target.value; render(); document.getElementById('ring').focus(); };
  document.querySelectorAll('button.state').forEach(b => b.onclick = () => { state.ring = b.dataset.ring; render(); document.querySelector(`button.state[data-ring="${state.ring}"]`).focus(); });
}
render();
</script>
</body>
</html>
