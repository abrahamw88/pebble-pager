<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 404' width='760' height='404' role='img' aria-label="The ring gets data from D10 and its ground through a transistor on D5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='13'>
<rect width='760' height='404' rx='12' fill='#FFFFFF'/>
<text x='24' y='30' font-size='15' font-weight='600' fill='#1F2124'>The ring gets data from D10 and its ground through a transistor on D5</text><text x='24' y='52' font-size='11.5' fill='#5F6267'>A wiring map: place parts in any free columns, as long as these connections hold</text><line x1='200' y1='80' x2='736' y2='80' stroke='#D64545' stroke-width='2'/><text x='24' y='84' font-size='11.5' fill='#1F2124'>+ rail, 3V3</text><line x1='200' y1='360' x2='736' y2='360' stroke='#8A8D93' stroke-width='2'/><text x='24' y='364' font-size='11.5' fill='#1F2124'>− rail, GND</text><rect x='24' y='120' width='150' height='210' rx='8' fill='#F1F0EC' stroke='#8A8D93' stroke-width='1.25'/><text x='40' y='144' font-weight='600' fill='#1F2124'>XIAO</text><text x='164' y='184' font-size='11.5' text-anchor='end' fill='#1F2124'>D10</text><text x='164' y='309' font-size='11.5' text-anchor='end' fill='#1F2124'>D5</text><path d='M174 180H400M460 180H540' fill='none' stroke='#3B7DD8' stroke-width='2' /><path d='M540 140H500V80' fill='none' stroke='#D64545' stroke-width='2' /><path d='M540 220H440V270' fill='none' stroke='#8A8D93' stroke-width='2' /><path d='M440 340V360' fill='none' stroke='#8A8D93' stroke-width='2' /><path d='M174 305H250M310 305H400' fill='none' stroke='#8A8D93' stroke-width='2' /><path d='M350 305V318M350 348V360' fill='none' stroke='#8A8D93' stroke-width='2' /><path d='M724 80V214M724 226V360' fill='none' stroke='#8A8D93' stroke-width='2' /><circle cx='174' cy='180' r='3.5' fill='#3B7DD8'/><circle cx='174' cy='305' r='3.5' fill='#8A8D93'/><circle cx='500' cy='80' r='3.5' fill='#D64545'/><circle cx='350' cy='305' r='3.5' fill='#8A8D93'/><circle cx='350' cy='360' r='3.5' fill='#8A8D93'/><circle cx='440' cy='360' r='3.5' fill='#8A8D93'/><circle cx='724' cy='80' r='3.5' fill='#D64545'/><circle cx='724' cy='360' r='3.5' fill='#8A8D93'/><rect x='400' y='171' width='60' height='18' rx='4' fill='#F1F0EC' stroke='#1F2124' stroke-width='1.25'/><rect x='250' y='296' width='60' height='18' rx='4' fill='#F1F0EC' stroke='#1F2124' stroke-width='1.25'/><rect x='341' y='318' width='18' height='30' rx='4' fill='#F1F0EC' stroke='#1F2124' stroke-width='1.25'/><text x='430' y='162' font-size='11.5' text-anchor='middle' fill='#1F2124'>330 Ω</text><text x='430' y='204' font-size='10.5' text-anchor='middle' fill='#5F6267'>near the ring</text><text x='280' y='288' font-size='11.5' text-anchor='middle' fill='#1F2124'>470 Ω</text><text x='334' y='338' font-size='11.5' text-anchor='end' fill='#1F2124'>10 kΩ</text><rect x='400' y='270' width='80' height='70' rx='8' fill='#3B7DD8' fill-opacity='0.12' stroke='#3B7DD8' stroke-width='2'/><text x='410' y='309' font-size='11.5' font-weight='600' fill='#1F2124'>B</text><text x='440' y='288' font-size='11.5' font-weight='600' text-anchor='middle' fill='#1F2124'>C</text><text x='440' y='332' font-size='11.5' font-weight='600' text-anchor='middle' fill='#1F2124'>E</text><text x='492' y='301' font-size='11.5' font-weight='600' fill='#1F2124'>PN2222A</text><text x='492' y='317' font-size='11.5' fill='#5F6267'>ring power switch</text><text x='492' y='333' font-size='11.5' fill='#5F6267'>flat toward you: E, B, C</text><rect x='540' y='110' width='160' height='140' rx='8' fill='none' stroke='#8A8D93' stroke-width='1.25'/><rect x='678' y='116' width='8' height='8' rx='2' fill='#E86C9A' fill-opacity='0.45' stroke='#E86C9A' stroke-width='1'/><rect x='678' y='127' width='8' height='8' rx='2' fill='#E86C9A' fill-opacity='0.45' stroke='#E86C9A' stroke-width='1'/><rect x='678' y='138' width='8' height='8' rx='2' fill='#E86C9A' fill-opacity='0.45' stroke='#E86C9A' stroke-width='1'/><rect x='678' y='149' width='8' height='8' rx='2' fill='#E86C9A' fill-opacity='0.45' stroke='#E86C9A' stroke-width='1'/><rect x='678' y='160' width='8' height='8' rx='2' fill='#E86C9A' fill-opacity='0.45' stroke='#E86C9A' stroke-width='1'/><rect x='678' y='171' width='8' height='8' rx='2' fill='#E86C9A' fill-opacity='0.45' stroke='#E86C9A' stroke-width='1'/><rect x='678' y='182' width='8' height='8' rx='2' fill='#E86C9A' fill-opacity='0.45' stroke='#E86C9A' stroke-width='1'/><rect x='678' y='193' width='8' height='8' rx='2' fill='#E86C9A' fill-opacity='0.45' stroke='#E86C9A' stroke-width='1'/><rect x='678' y='204' width='8' height='8' rx='2' fill='#E86C9A' fill-opacity='0.45' stroke='#E86C9A' stroke-width='1'/><rect x='678' y='215' width='8' height='8' rx='2' fill='#E86C9A' fill-opacity='0.45' stroke='#E86C9A' stroke-width='1'/><rect x='678' y='226' width='8' height='8' rx='2' fill='#E86C9A' fill-opacity='0.45' stroke='#E86C9A' stroke-width='1'/><rect x='678' y='237' width='8' height='8' rx='2' fill='#E86C9A' fill-opacity='0.45' stroke='#E86C9A' stroke-width='1'/><text x='540' y='102' font-size='11.5' font-weight='600' fill='#1F2124'>NeoPixel ring, 12 RGBW pixels</text><text x='552' y='144' font-size='11.5' font-weight='600' fill='#1F2124'>5V / PWR</text><text x='552' y='184' font-size='11.5' font-weight='600' fill='#1F2124'>IN (data input)</text><text x='552' y='224' font-size='11.5' font-weight='600' fill='#1F2124'>GND</text><line x1='712' y1='214' x2='736' y2='214' stroke='#1F2124' stroke-width='2.5'/><line x1='712' y1='226' x2='736' y2='226' stroke='#1F2124' stroke-width='2.5'/><text x='712' y='286' font-size='11.5' font-weight='600' text-anchor='end' fill='#1F2124'>1000 µF</text><text x='712' y='302' font-size='11.5' text-anchor='end' fill='#5F6267'>stripe to − rail</text><text x='24' y='388' font-size='11.5' fill='#5F6267'>D5 high switches the ring on. With D5 low the ring draws nothing, and the firmware lets go of D10 too. Leave the ring's OUT pad empty.</text>
</svg>
