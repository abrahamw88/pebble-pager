<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 200' width='760' height='200' role='img' aria-label="One data cable powers and programs the XIAO" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='13'>
<rect width='760' height='200' rx='12' fill='#FFFFFF'/>
<text x='24' y='30' font-size='15' font-weight='600' fill='#1F2124'>One data cable powers and programs the XIAO</text><rect x='24' y='64' width='280' height='104' rx='8' fill='none' stroke='#8A8D93' stroke-width='1.25'/><text x='40' y='88' font-weight='600' fill='#1F2124'>Computer: Arduino IDE 2 or arduino-cli</text><text x='40' y='112' font-size='11.5' fill='#5F6267'>Board: XIAO_ESP32C3</text><text x='40' y='130' font-size='11.5' fill='#5F6267'>Port: the XIAO's USB port</text><text x='40' y='148' font-size='11.5' fill='#5F6267'>Serial Monitor at 115200 baud</text><path d='M304 116H456' fill='none' stroke='#8A8D93' stroke-width='3' stroke-linecap='round'/><text x='380' y='104' font-size='11.5' text-anchor='middle' fill='#5F6267'>USB-C data cable</text><text x='380' y='136' font-size='11.5' text-anchor='middle' fill='#5F6267'>power, upload, serial</text><rect x='456' y='64' width='280' height='104' rx='8' fill='#3B7DD8' fill-opacity='0.12' stroke='#3B7DD8' stroke-width='2'/><text x='472' y='88' font-weight='600' fill='#1F2124'>XIAO ESP32-C3</text><text x='472' y='112' font-size='11.5' fill='#1F2124'>Tiny BOOT and RESET buttons on top</text><text x='472' y='130' font-size='11.5' fill='#1F2124'>Red LED only shows charging</text><text x='472' y='148' font-size='11.5' fill='#1F2124'>Check (-DTEST=1): chip, MAC, Wi-Fi list</text>
</svg>
