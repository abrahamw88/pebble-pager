<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 316' width='760' height='316' role='img' aria-label="Button 1 lights the ring pink and buzzes; button 2 shows a green gauge" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='13'>
<rect width='760' height='316' rx='12' fill='#FFFFFF'/>
<text x='24' y='30' font-size='15' font-weight='600' fill='#1F2124'>Button 1 lights the ring pink and buzzes; button 2 shows a green gauge</text><text x='24' y='52' font-size='11.5' fill='#5F6267'>What the -DTEST=2 build should do, with the Serial Monitor open at 115200 baud</text><line x1='24' y1='100' x2='736' y2='100' stroke='#8A8D93' stroke-width='1.25'/><line x1='24' y1='170' x2='736' y2='170' stroke='#C4C6CB'/><line x1='24' y1='230' x2='736' y2='230' stroke='#C4C6CB'/><text x='24' y='88' font-size='11.5' fill='#5F6267'>You do</text><text x='216' y='88' font-size='11.5' fill='#5F6267'>Ring shows</text><text x='440' y='88' font-size='11.5' fill='#5F6267'>Motor</text><text x='552' y='88' font-size='11.5' fill='#5F6267'>Serial Monitor prints</text><rect x='216' y='122' width='10' height='10' rx='2.5' fill='#3B7DD8' fill-opacity='0.45' stroke='#3B7DD8' stroke-width='1'/><rect x='230' y='122' width='10' height='10' rx='2.5' fill='#3B7DD8' fill-opacity='0.45' stroke='#3B7DD8' stroke-width='1'/><rect x='244' y='122' width='10' height='10' rx='2.5' fill='#3B7DD8' fill-opacity='0.45' stroke='#3B7DD8' stroke-width='1'/><rect x='258' y='122' width='10' height='10' rx='2.5' fill='#3B7DD8' fill-opacity='0.45' stroke='#3B7DD8' stroke-width='1'/><rect x='272' y='122' width='10' height='10' rx='2.5' fill='#3B7DD8' fill-opacity='0.45' stroke='#3B7DD8' stroke-width='1'/><rect x='286' y='122' width='10' height='10' rx='2.5' fill='#3B7DD8' fill-opacity='0.45' stroke='#3B7DD8' stroke-width='1'/><rect x='300' y='122' width='10' height='10' rx='2.5' fill='#3B7DD8' fill-opacity='0.45' stroke='#3B7DD8' stroke-width='1'/><rect x='314' y='122' width='10' height='10' rx='2.5' fill='none' fill-opacity='1' stroke='#8A8D93' stroke-width='1'/><rect x='328' y='122' width='10' height='10' rx='2.5' fill='none' fill-opacity='1' stroke='#8A8D93' stroke-width='1'/><rect x='342' y='122' width='10' height='10' rx='2.5' fill='none' fill-opacity='1' stroke='#8A8D93' stroke-width='1'/><rect x='356' y='122' width='10' height='10' rx='2.5' fill='none' fill-opacity='1' stroke='#8A8D93' stroke-width='1'/><rect x='370' y='122' width='10' height='10' rx='2.5' fill='none' fill-opacity='1' stroke='#8A8D93' stroke-width='1'/><text x='24' y='136' font-weight='600' fill='#1F2124'>Upload the build</text><text x='24' y='152' font-size='11.5' fill='#5F6267'>or press RESET</text><text x='216' y='152' fill='#1F2124'>blue sweep, then all white</text><text x='440' y='144' fill='#5F6267'>no buzz</text><text x='552' y='144' fill='#5F6267'>nothing</text><rect x='216' y='182' width='10' height='10' rx='2.5' fill='#E86C9A' fill-opacity='0.45' stroke='#E86C9A' stroke-width='1'/><rect x='230' y='182' width='10' height='10' rx='2.5' fill='#E86C9A' fill-opacity='0.45' stroke='#E86C9A' stroke-width='1'/><rect x='244' y='182' width='10' height='10' rx='2.5' fill='#E86C9A' fill-opacity='0.45' stroke='#E86C9A' stroke-width='1'/><rect x='258' y='182' width='10' height='10' rx='2.5' fill='#E86C9A' fill-opacity='0.45' stroke='#E86C9A' stroke-width='1'/><rect x='272' y='182' width='10' height='10' rx='2.5' fill='#E86C9A' fill-opacity='0.45' stroke='#E86C9A' stroke-width='1'/><rect x='286' y='182' width='10' height='10' rx='2.5' fill='#E86C9A' fill-opacity='0.45' stroke='#E86C9A' stroke-width='1'/><rect x='300' y='182' width='10' height='10' rx='2.5' fill='#E86C9A' fill-opacity='0.45' stroke='#E86C9A' stroke-width='1'/><rect x='314' y='182' width='10' height='10' rx='2.5' fill='#E86C9A' fill-opacity='0.45' stroke='#E86C9A' stroke-width='1'/><rect x='328' y='182' width='10' height='10' rx='2.5' fill='#E86C9A' fill-opacity='0.45' stroke='#E86C9A' stroke-width='1'/><rect x='342' y='182' width='10' height='10' rx='2.5' fill='#E86C9A' fill-opacity='0.45' stroke='#E86C9A' stroke-width='1'/><rect x='356' y='182' width='10' height='10' rx='2.5' fill='#E86C9A' fill-opacity='0.45' stroke='#E86C9A' stroke-width='1'/><rect x='370' y='182' width='10' height='10' rx='2.5' fill='#E86C9A' fill-opacity='0.45' stroke