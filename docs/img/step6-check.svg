width='10' height='10' rx='2.5' fill='none' fill-opacity='1' stroke='#8A8D93' stroke-width='1'/><path d='M440 248l5 -6l5 12l5 -12l5 12l5 -12l5 6' fill='none' stroke='#8A8D93' stroke-width='1.5' /><rect x='552' y='244' width='184' height='28' rx='6' fill='#F1F0EC' stroke='#C4C6CB'/><text x='24' y='256' font-weight='600' fill='#1F2124'>Tap button 2</text><text x='24' y='272' font-size='11.5' fill='#5F6267'>wired to D3</text><text x='216' y='272' fill='#1F2124'>9 green pixels for 1 s</text><text x='440' y='272' fill='#1F2124'>short</text><text x='564' y='264' font-family='ui-monospace, Menlo, monospace' fill='#1F2124'>Eliana: Button 2</text><text x='24' y='300' font-size='11.5' fill='#5F6267'>The name in front is the device's own (Eliana until it is changed on the setup page). This check runs the motor at full power.</text>
</svg>
