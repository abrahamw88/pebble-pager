<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 312' width='760' height='312' role='img' aria-label="A command goes in through ntfy, and the answer comes out to the phone" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='13'>
<rect width='760' height='312' rx='12' fill='#FFFFFF'/>
<defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#8A8D93'/></marker></defs><text x='24' y='30' font-size='15' font-weight='600' fill='#1F2124'>A command goes in through ntfy, and the answer comes out to the phone</text><text x='24' y='52' font-size='11.5' fill='#5F6267'>Test 1 posts from the computer to the phone. Test 2 posts "update" to the device, which answers on the phone topic</text><path d='M224 128H276' fill='none' stroke='#8A8D93' stroke-width='1.25' marker-end='url(#a)'/><path d='M480 140H536' fill='none' stroke='#8A8D93' stroke-width='1.25' marker-end='url(#a)'/><path d='M380 232V176' fill='none' stroke='#8A8D93' stroke-width='1.25' marker-end='url(#a)'/><path d='M276 152H228' fill='none' stroke='#8A8D93' stroke-width='1.25' marker-end='url(#a)'/><text x='252' y='118' font-size='11.5' text-anchor='middle' fill='#5F6267'>answer</text><text x='252' y='168' font-size='11.5' text-anchor='middle' fill='#5F6267'>update</text><text x='508' y='130' font-size='11.5' text-anchor='middle' fill='#5F6267'>push</text><text x='390' y='208' font-size='11.5' fill='#5F6267'>tests 1 and 2</text><rect x='24.0' y='104' width='200' height='72' rx='8' fill='none' fill-opacity='1' stroke='#8A8D93' stroke-width='1.25'/><text x='40' y='128' font-weight='600' fill='#1F2124'>Breadboard XIAO</text><text x='40' y='144' font-size='11.5' fill='#5F6267'>the firmware, on your</text><text x='40' y='160' font-size='11.5' fill='#5F6267'>2.4 GHz Wi-Fi</text><rect x='280.0' y='104' width='200' height='72' rx='8' fill='#3B7DD8' fill-opacity='0.12' stroke='#3B7DD8' stroke-width='2'/><text x='296' y='128' font-weight='600' fill='#1F2124'>ntfy.sh</text><text x='296' y='144' font-size='11.5' fill='#1F2124'>topics: base-name (inbox)</text><text x='296' y='160' font-size='11.5' fill='#1F2124'>and base-phone</text><rect x='536.0' y='104' width='200' height='72' rx='8' fill='none' fill-opacity='1' stroke='#8A8D93' stroke-width='1.25'/><text x='552' y='128' font-weight='600' fill='#1F2124'>iPhone, ntfy app</text><text x='552' y='144' font-size='11.5' fill='#5F6267'>subscribed to</text><text x='552' y='160' font-size='11.5' fill='#5F6267'>base-phone</text><rect x='280.0' y='232' width='200' height='56' rx='8' fill='none' fill-opacity='1' stroke='#8A8D93' stroke-width='1.25'/><text x='296' y='256' font-weight='600' fill='#1F2124'>Computer</text><text x='296' y='272' font-size='11.5' fill='#5F6267'>ntfy.sh/app in a browser</text>
</svg>
