<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 372' width='760' height='372' role='img' aria-label="The battery solders under the XIAO; two resistors let D1 read its voltage" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='13'>
<rect width='760' height='372' rx='12' fill='#FFFFFF'/>
<text x='24' y='30' font-size='15' font-weight='600' fill='#1F2124'>The battery solders under the XIAO; two resistors let D1 read its voltage</text><text x='24' y='52' font-size='11.5' fill='#5F6267'>Check the plug's polarity with a multimeter before soldering, and read BAT+ and BAT− off the board itself</text><rect x='24' y='96' width='140' height='96' rx='8' fill='#F1F0EC' stroke='#8A8D93' stroke-width='1.25'/><text x='40' y='122' font-weight='600' fill='#1F2124'>LiPo cell</text><text x='40' y='140' font-size='11.5' fill='#5F6267'>3.7 V, 2,000 mAh</text><text x='40' y='156' font-size='11.5' fill='#5F6267'>with JST plug</text><rect x='196' y='116' width='32' height='56' rx='4' fill='#F1F0EC' stroke='#1F2124' stroke-width='1.25'/><text x='212' y='190' font-size='11.5' text-anchor='middle' fill='#5F6267'>JST</text><path d='M164 132H196M228 132H404' fill='none' stroke='#1F2124' stroke-width='2' /><path d='M164 156H196M228 156H404' fill='none' stroke='#D64545' stroke-width='2' /><text x='244' y='124' font-size='11.5' fill='#5F6267'>black (−)</text><text x='244' y='176' font-size='11.5' fill='#5F6267'>red (+)</text><rect x='400' y='96' width='170' height='96' rx='8' fill='#F1F0EC' stroke='#8A8D93' stroke-width='1.25'/><rect x='404' y='126' width='12' height='12' rx='2' fill='#C98A3B' fill-opacity='0.6' stroke='#C98A3B'/><rect x='404' y='150' width='12' height='12' rx='2' fill='#C98A3B' fill-opacity='0.6' stroke='#C98A3B'/><text x='424' y='136' font-size='11.5' font-weight='600' fill='#1F2124'>BAT−</text><text x='424' y='160' font-size='11.5' font-weight='600' fill='#1F2124'>BAT+</text><text x='416' y='182' font-weight='600' fill='#1F2124'>XIAO, underside</text><path d='M330 156V250H360' fill='none' stroke='#D64545' stroke-width='2' /><path d='M420 250H520' fill='none' stroke='#3B7DD8' stroke-width='2' /><path d='M490 250V276' fill='none' stroke='#3B7DD8' stroke-width='2' /><path d='M580 250H650V330' fill='none' stroke='#8A8D93' stroke-width='2' /><rect x='360' y='241' width='60' height='18' rx='4' fill='#F1F0EC' stroke='#1F2124' stroke-width='1.25'/><rect x='520' y='241' width='60' height='18' rx='4' fill='#F1F0EC' stroke='#1F2124' stroke-width='1.25'/><circle cx='330' cy='156' r='3.5' fill='#D64545'/><circle cx='490' cy='250' r='3.5' fill='#3B7DD8'/><circle cx='490' cy='276' r='3.5' fill='#3B7DD8'/><circle cx='650' cy='330' r='3.5' fill='#8A8D93'/><text x='390' y='232' font-size='11.5' text-anchor='middle' fill='#1F2124'>220 kΩ</text><text x='550' y='232' font-size='11.5' text-anchor='middle' fill='#1F2124'>220 kΩ</text><text x='490' y='296' font-size='11.5' font-weight='600' text-anchor='middle' fill='#1F2124'>to D1 (A1)</text><text x='318' y='212' font-size='11.5' text-anchor='end' fill='#5F6267'>jumper from BAT+</text><line x1='200' y1='330' x2='736' y2='330' stroke='#8A8D93' stroke-width='2'/><text x='24' y='334' font-size='11.5' fill='#1F2124'>− rail, GND</text><text x='24' y='360' font-size='11.5' fill='#5F6267'>The two equal resistors halve the battery voltage so D1 can read it safely. BAT− is already ground.</text>
</svg>
